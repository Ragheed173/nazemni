name: nazemni

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nazemni
      POSTGRES_USER: nazemni
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nazemni -d nazemni"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://nazemni:${DB_PASSWORD}@db:5432/nazemni?schema=public
      WEB_ORIGIN: ${WEB_ORIGIN}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-30}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-INVITE_ONLY}
      OWNER_USERNAME: ${OWNER_USERNAME:-ragheed}
      OWNER_EMAIL: ${OWNER_EMAIL:-ragheed@nazemni.online}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-20b}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1200}
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-5}
      AI_REQUESTS_PER_DAY: ${AI_REQUESTS_PER_DAY:-20}
      AI_MAX_MESSAGE_LENGTH: ${AI_MAX_MESSAGE_LENGTH:-4000}
      AI_MAX_TOOL_ITERATIONS: ${AI_MAX_TOOL_ITERATIONS:-4}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_HISTORY_MAX_MESSAGES: ${AI_HISTORY_MAX_MESSAGES:-8}
      AI_HISTORY_MAX_TOKENS: ${AI_HISTORY_MAX_TOKENS:-1200}
      AI_INPUT_TOKEN_BUDGET_PER_MINUTE: ${AI_INPUT_TOKEN_BUDGET_PER_MINUTE:-7000}
      AI_MAX_CONCURRENT_PER_USER: ${AI_MAX_CONCURRENT_PER_USER:-1}
    ports:
      - "${NAZEMNI_BIND_IP}:${NAZEMNI_PORT}:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
